<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pay to unlock — Smartef Bookshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
  .pay-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .pay-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 36px 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: var(--shadow);
  }
  .pay-back {
    display: inline-block;
    margin-bottom: 20px;
    font-size: 0.85rem;
    color: var(--ink-dim);
    text-decoration: none;
  }
  .pay-cover {
    height: 140px;
    border-radius: 8px;
    display: flex;
    align-items: flex-end;
    padding: 14px;
    margin-bottom: 18px;
  }
  .pay-cover .initial { font-family: var(--font-display); font-size: 2.6rem; color: rgba(255,255,255,0.35); font-weight: 600; }
  .pay-title { font-size: 1.4rem; margin: 0 0 4px; font-family: var(--font-display); font-weight: 600; }
  .pay-author { color: var(--ink-dim); font-size: 0.92rem; margin: 0 0 20px; }
  .pay-price-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-top: 1px solid rgba(34,31,26,0.15); border-bottom: 1px solid rgba(34,31,26,0.15);
    margin-bottom: 22px; font-family: var(--font-mono);
  }
  .pay-price { font-size: 1.3rem; color: var(--red); font-weight: 500; }
  .pay-submit {
    width: 100%; padding: 13px; border-radius: 6px; border: none;
    background: var(--ink); color: var(--paper); font-weight: 600; font-size: 0.95rem; cursor: pointer;
  }
  .pay-status { margin-top: 14px; font-size: 0.88rem; text-align: center; color: var(--ink-dim); }
  .pay-status.success { color: #2f6b3a; font-weight: 600; }
  .pay-status.error { color: var(--red); font-weight: 600; }
  [hidden] { display: none !important; }

  .pay-divider {
    display: flex; align-items: center; gap: 10px; margin: 26px 0 18px;
    font-size: 0.78rem; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.04em;
  }
  .pay-divider::before, .pay-divider::after { content: ''; flex: 1; height: 1px; background: rgba(34,31,26,0.15); }

  .manual-methods { display: flex; flex-direction: column; gap: 14px; }
  .manual-method {
    border: 1px solid rgba(34,31,26,0.15); border-radius: 8px; padding: 14px 16px;
  }
  .manual-method h3 { margin: 0 0 10px; font-size: 0.92rem; font-family: var(--font-display); font-weight: 600; }
  .manual-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    font-family: var(--font-mono); font-size: 0.82rem; padding: 5px 0;
  }
  .manual-row .manual-label { color: var(--ink-dim); flex-shrink: 0; }
  .manual-row .manual-value { text-align: right; word-break: break-all; }
  .copy-btn {
    border: 1px solid rgba(34,31,26,0.25); background: transparent; color: var(--ink);
    border-radius: 5px; padding: 2px 8px; font-size: 0.72rem; cursor: pointer; margin-left: 8px; flex-shrink: 0;
  }
  .copy-btn:hover { background: rgba(34,31,26,0.08); }
  .manual-note {
    font-size: 0.78rem; color: var(--ink-dim); margin: 10px 0 12px;
  }
  .manual-submit {
    width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--ink);
    background: transparent; color: var(--ink); font-weight: 600; font-size: 0.85rem; cursor: pointer;
  }
  .manual-submit:hover { background: rgba(34,31,26,0.06); }
  .claim-pending {
    font-size: 0.82rem; text-align: center; padding: 8px; border-radius: 6px;
    background: rgba(212,160,23,0.15); color: #7a5c0a; font-weight: 600;
  }
</style>
</head>
<body>
<div class="pay-wrap">
  <div class="pay-card">
    <a class="pay-back" href="/">← Back to Smartef Bookshop</a>
    <div id="payContent">Loading book…</div>
  </div>
</div>
<script src="/pay.js"></script>
</body>
</html>
