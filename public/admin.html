<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin portal — Smartef Bookshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />
<style>
  .admin-wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }
  .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .admin-header h1 { font-size: 1.6rem; }
  .admin-back { color: var(--text-dim); text-decoration: none; font-size: 0.85rem; }

  .admin-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 28px;
  }
  .admin-panel h2 { font-size: 1.15rem; margin-bottom: 16px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-field label { display: block; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 5px; }
  .form-field input, .form-field select, .form-field textarea {
    width: 100%; padding: 9px 11px; border-radius: 6px; border: 1px solid var(--line-strong);
    background: var(--bg-raised); color: var(--text); font-size: 0.88rem; font-family: inherit;
  }
  .form-field textarea { min-height: 60px; resize: vertical; }

  .admin-submit {
    padding: 10px 18px; border-radius: 6px; border: none; background: var(--gold);
    color: var(--ink); font-weight: 600; font-size: 0.88rem; cursor: pointer;
  }
  .form-status { font-size: 0.82rem; color: var(--text-dim); margin-top: 10px; }
  .form-status.error { color: var(--red); }
  .form-status.success { color: #8fd19e; }

  .book-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 0;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .book-row:last-child { border-bottom: none; }
  .book-row .book-info { flex: 1; min-width: 180px; }
  .book-row .book-info strong { font-family: var(--font-display); }
  .book-row .book-info span { display: block; font-size: 0.78rem; color: var(--text-dim); }

  .price-input { width: 90px; padding: 6px 8px; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--bg-raised); color: var(--text); font-family: var(--font-mono); font-size: 0.85rem; }

  .lock-toggle {
    padding: 6px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: 1px solid transparent;
  }
  .lock-toggle.locked { background: rgba(181,68,58,0.18); color: #f0b8b0; border-color: var(--red); }
  .lock-toggle.unlocked { background: rgba(139,197,150,0.18); color: #a8e0b3; border-color: #4caf6a; }

  .file-status { font-size: 0.75rem; color: var(--text-dim); min-width: 90px; }
  .file-input-wrap input[type="file"] { font-size: 0.72rem; max-width: 130px; }

  .delete-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.8rem; }
  .delete-btn:hover { color: var(--red); }

  .category-group h3 { font-family: var(--font-display); font-size: 1rem; margin: 22px 0 6px; color: var(--gold); }
  .category-group:first-of-type h3 { margin-top: 0; }

  .unauthorized { text-align: center; padding: 80px 20px; color: var(--text-dim); }

  .claim-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 0;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .claim-row:last-child { border-bottom: none; }
  .claim-row .claim-info { flex: 1; min-width: 200px; }
  .claim-row .claim-info strong { font-family: var(--font-display); }
  .claim-row .claim-info span { display: block; font-size: 0.78rem; color: var(--text-dim); }
  .claim-method {
    padding: 4px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 600;
    background: rgba(212,160,23,0.15); color: var(--gold); white-space: nowrap;
  }
  .claim-approve, .claim-reject {
    padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: 1px solid transparent;
  }
  .claim-approve { background: rgba(139,197,150,0.18); color: #a8e0b3; border-color: #4caf6a; }
  .claim-reject { background: rgba(181,68,58,0.18); color: #f0b8b0; border-color: var(--red); }
</style>
</head>
<body>

<div class="admin-wrap">
  <div class="admin-header">
    <h1>Admin portal</h1>
    <a class="admin-back" href="/">← Back to shop</a>
  </div>

  <div id="adminContent">Loading…</div>
</div>

<script src="/admin.js"></script>
</body>
</html>
