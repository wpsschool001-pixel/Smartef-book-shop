<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smartef Bookshop — sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />
<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 36px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow);
  }
  .auth-card h1 { font-size: 1.5rem; margin-bottom: 6px; }
  .auth-card p.sub { color: var(--text-dim); font-size: 0.88rem; margin: 0 0 24px; }
  .auth-field { margin-bottom: 16px; }
  .auth-field label { display: block; font-size: 0.82rem; color: var(--text-dim); margin-bottom: 6px; }
  .auth-field input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--line-strong);
    background: var(--bg-raised);
    color: var(--text);
    font-size: 0.95rem;
  }
  .auth-submit {
    width: 100%;
    margin-top: 8px;
    padding: 12px;
    border-radius: 6px;
    border: none;
    background: var(--gold);
    color: var(--ink);
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .auth-switch {
    text-align: center;
    margin-top: 18px;
    font-size: 0.86rem;
    color: var(--text-dim);
  }
  .auth-switch button {
    background: none;
    border: none;
    color: var(--gold);
    cursor: pointer;
    font-size: 0.86rem;
    text-decoration: underline;
  }
  .auth-error {
    background: rgba(181, 68, 58, 0.15);
    border: 1px solid var(--red);
    color: #f0b8b0;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <img src="/logo.jpg" alt="Smartef Bookshop logo" style="width:56px; height:56px; object-fit:cover; border-radius:8px; margin-bottom:16px;" />
    <h1 id="formTitle">Welcome back</h1>
    <p class="sub" id="formSub">Sign in to browse the shelves.</p>

    <p class="auth-error" id="authError" hidden></p>

    <form id="authForm">
      <div class="auth-field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required minlength="3" />
      </div>
      <div class="auth-field" id="emailField" hidden>
        <label for="email">Email <span style="opacity:0.7;">(used for payment receipts)</span></label>
        <input id="email" name="email" type="email" autocomplete="email" />
      </div>
      <div class="auth-field">
        <label for="password" id="passwordLabel">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" />
      </div>
      <div class="auth-field" id="securityField" hidden>
        <label for="securityAnswer">Security question: what's your favorite book title? <span style="opacity:0.7;">(used if you forget your password)</span></label>
        <input id="securityAnswer" name="securityAnswer" type="text" minlength="2" />
      </div>
      <button class="auth-submit" type="submit" id="submitBtn">Sign in</button>
    </form>

    <p class="auth-switch" id="forgotPrompt">
      <button type="button" id="forgotBtn">Forgot password?</button>
    </p>

    <p class="auth-switch">
      <span id="switchPrompt">New here?</span>
      <button type="button" id="switchBtn">Create an account</button>
    </p>
  </div>
</div>

<script src="/login.js"></script>
</body>
</html>
